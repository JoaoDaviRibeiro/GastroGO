<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GastroGO Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-profile">
    <script>
        (function(){
            function showError(msg){
                try{
                    var id='runtime-errors';
                    var el=document.getElementById(id);
                    if(!el){
                        el=document.createElement('div'); el.id=id;
                        el.style.position='fixed'; el.style.left=0; el.style.right=0; el.style.top=0; el.style.zIndex=99999;
                        el.style.background='rgba(200,50,50,0.95)'; el.style.color='white'; el.style.padding='8px'; el.style.fontFamily='monospace'; el.style.fontSize='13px';
                        document.documentElement.appendChild(el);
                    }
                    var p=document.createElement('div'); p.textContent=String(msg);
                    el.appendChild(p);
                }catch(e){/* ignore */}
            }
            window.addEventListener('error', function(ev){ showError(ev.message + ' @ ' + (ev.filename||'') + ':' + (ev.lineno||'') ); });
            window.addEventListener('unhandledrejection', function(ev){ showError('UnhandledRejection: ' + (ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason)) ); });
            window.onerror = function(){ showError(Array.prototype.join.call(arguments,' ')); };
        })();
    </script>
    <main class="page profile-page">
        <div class="bg-mesh"></div>
        <div class="noise"></div>
        <div id="root"></div>
    </main>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
    <script type="text/babel" data-presets="env,react">
        const emptyProfile = {
            email: '',
            full_name: '',
            title: '',
            phone: '',
            location: '',
            bio: '',
            timezone: 'UTC',
            sms_alerts: false,
            digest_opt_in: true
        };

        function LanguageSwitcher({ variant = 'default' }) {
            const { locale, setLocale, t, options } = window.useI18n();
            const className = variant === 'compact' ? 'locale-toggle compact' : 'locale-toggle';

            return (
                <label className={className}>
                    <span>{t('common.language.label')}</span>
                    <select
                        value={locale}
                        onChange={(event) => setLocale(event.target.value)}
                        aria-label={t('common.language.label')}
                    >
                        {options.map((option) => (
                            <option key={option} value={option}>
                                {t(`common.language.options.${option}`)}
                            </option>
                        ))}
                    </select>
                </label>
            );
        }

        function ThemeToggle({ theme, onToggle }) {
            const { t } = window.useI18n();
            const nextLabel = theme === 'dark' ? t('common.themeToggle.toLight') : t('common.themeToggle.toDark');

            return (
                <button
                    type="button"
                    className="theme-toggle"
                    onClick={onToggle}
                    aria-label={nextLabel}
                >
                    <span className="theme-toggle-track" aria-hidden="true">
                        <span className="theme-toggle-thumb" data-theme={theme}></span>
                    </span>
                </button>
            );
        }

        function ProfileApp() {
            const { t, locale } = window.useI18n();
            const [profile, setProfile] = React.useState(emptyProfile);
            const [original, setOriginal] = React.useState(emptyProfile);
            const [loading, setLoading] = React.useState(true);
            const [saving, setSaving] = React.useState(false);
            const [status, setStatus] = React.useState({ tone: 'info', message: '' });
            const [theme, setTheme] = React.useState(() => {
                if (typeof window !== 'undefined' && window.getPreferredTheme) {
                    return window.getPreferredTheme();
                }
                return 'dark';
            });
            const tokenRef = React.useRef(null);

            React.useEffect(() => {
                document.title = t('meta.title.profile');
            }, [locale, t]);

            const hydrateProfile = (data = {}) => {
                const fallbackName = data.full_name || (data.email ? data.email.split('@')[0] : '');
                return { ...emptyProfile, ...data, full_name: fallbackName };
            };

            const loadProfile = React.useCallback(async () => {
                const token = localStorage.getItem('sb_token');
                tokenRef.current = token;

                if (!token) {
                    window.location.href = '/';
                    return;
                }

                setLoading(true);
                setStatus({ tone: 'info', message: t('profile.status.loading') });

                try {
                    let response = await fetch('/api/profile', {
                        headers: { Authorization: `Bearer ${token}` }
                    });

                    if (response.status === 401) {
                        if (window.handleSessionExpiry) {
                            window.handleSessionExpiry();
                        } else {
                            localStorage.removeItem('sb_token');
                            window.location.href = '/';
                        }
                        return;
                    }

                    if (response.status === 404) {
                        console.warn('Profile endpoint missing. Falling back to dashboard payload.');
                        response = await fetch('/api/dashboard', {
                            headers: { Authorization: `Bearer ${token}` }
                        });

                        if (!response.ok) {
                            throw new Error('Fallback request failed');
                        }

                        const dashboardData = await response.json();
                        const hydratedFallback = hydrateProfile({
                            email: dashboardData.email,
                            full_name: dashboardData.full_name
                        });

                        setProfile(hydratedFallback);
                        setOriginal(hydratedFallback);
                        setStatus({ tone: 'info', message: t('profile.status.fallback') });
                        return;
                    }

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error || 'Profile request failed');
                    }

                    const data = await response.json();
                    const hydrated = hydrateProfile(data);

                    setProfile(hydrated);
                    setOriginal(hydrated);
                    setStatus({ tone: 'success', message: t('profile.status.ready') });
                } catch (error) {
                    console.error('Profile load failed:', error);
                    setStatus({ tone: 'error', message: error.message || t('profile.status.errorFetch') });
                } finally {
                    setLoading(false);
                }
            }, [t]);

            React.useEffect(() => {
                loadProfile();
            }, [loadProfile]);

            React.useEffect(() => {
                if (typeof window === 'undefined') return;
                if (window.setPreferredTheme) {
                    window.setPreferredTheme(theme);
                } else {
                    document.body?.setAttribute('data-theme', theme);
                    localStorage.setItem('gg_theme', theme);
                }
            }, [theme]);

            React.useEffect(() => {
                if (typeof window === 'undefined') return undefined;
                const handleThemeChange = (event) => {
                    const next = event.detail?.theme;
                    setTheme((prev) => (next && next !== prev ? next : prev));
                };
                window.addEventListener('gastro:theme-change', handleThemeChange);
                return () => window.removeEventListener('gastro:theme-change', handleThemeChange);
            }, []);

            const toggleTheme = React.useCallback(() => {
                setTheme((prev) => (prev === 'dark' ? 'light' : 'dark'));
            }, []);

            const handleFieldChange = (field) => (event) => {
                const value = event.target.type === 'checkbox' ? event.target.checked : event.target.value;
                setProfile((prev) => ({ ...prev, [field]: value }));
            };

            const handleReset = () => {
                setProfile(original);
                setStatus({ tone: 'info', message: t('profile.status.reverted') });
            };

            const handleSave = async (event) => {
                event.preventDefault();
                const token = tokenRef.current || localStorage.getItem('sb_token');

                if (!token) {
                    window.location.href = '/';
                    return;
                }

                setSaving(true);
                setStatus({ tone: 'info', message: t('profile.status.saving') });

                try {
                    const response = await fetch('/api/profile', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: `Bearer ${token}`
                        },
                        body: JSON.stringify(profile)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error || 'Update failed');
                    }

                    setOriginal(profile);
                    setStatus({ tone: 'success', message: t('profile.status.saved') });
                } catch (error) {
                    console.error('Profile save failed:', error);
                    setStatus({ tone: 'error', message: error.message || t('profile.status.saveError') });
                } finally {
                    setSaving(false);
                }
            };

            const handleLogout = () => {
                if (window.logout) {
                    window.logout();
                } else {
                    localStorage.removeItem('sb_token');
                    window.location.href = '/';
                }
            };

            const navigateToDashboard = () => {
                window.location.href = '/dashboard.html';
            };

            return (
                <div className="profile-shell">
                    <header className="profile-header">
                        <div>
                            <p className="eyebrow">{t('profile.header.eyebrow')}</p>
                            <h1>{t('profile.header.title')}</h1>
                            <p>{t('profile.header.body')}</p>
                        </div>
                        <div className="header-actions">
                            <LanguageSwitcher variant="compact" />
                            <ThemeToggle theme={theme} onToggle={toggleTheme} />
                            <div className="user-pill">
                                <span>{profile.email || t('dashboard.userPillFallback')}</span>
                            </div>
                            <button className="ghost" type="button" onClick={navigateToDashboard}>{t('common.actions.backToDashboard')}</button>
                            <button className="ghost" type="button" onClick={handleLogout}>{t('common.actions.logout')}</button>
                        </div>
                    </header>

                    {status.message && (
                        <div className={`status-strip ${status.tone}`} role="status">
                            {status.message}
                        </div>
                    )}

                    <section className="profile-grid">
                        <article className="profile-card">
                            <h2>{t('profile.section.personalTitle')}</h2>
                            <p className="card-lede">{t('profile.section.personalLede')}</p>
                            {loading ? (
                                <div className="panel-loading">{t('profile.panel.loading')}</div>
                            ) : (
                                <form className="profile-form" onSubmit={handleSave}>
                                    <label>
                                        {t('profile.form.fullName')}
                                        <input type="text" value={profile.full_name} onChange={handleFieldChange('full_name')} placeholder={t('common.placeholders.profileName')} required />
                                    </label>
                                    <label>
                                        {t('profile.form.title')}
                                        <input type="text" value={profile.title} onChange={handleFieldChange('title')} placeholder={t('common.placeholders.profileTitle')} />
                                    </label>
                                    <label>
                                        {t('profile.form.phone')}
                                        <input type="tel" value={profile.phone} onChange={handleFieldChange('phone')} placeholder={t('common.placeholders.phone')} />
                                    </label>
                                    <label>
                                        {t('profile.form.location')}
                                        <input type="text" value={profile.location} onChange={handleFieldChange('location')} placeholder={t('common.placeholders.location')} />
                                    </label>
                                    <label>
                                        {t('profile.form.bio')}
                                        <textarea value={profile.bio} onChange={handleFieldChange('bio')} rows="3" placeholder={t('common.placeholders.bio')} />
                                    </label>

                                    <div className="form-actions">
                                        <button type="button" className="ghost" onClick={handleReset} disabled={saving}>{t('profile.form.reset')}</button>
                                        <button type="submit" className="primary" disabled={saving}>
                                            {saving ? t('profile.form.saving') : t('profile.form.save')}
                                        </button>
                                    </div>
                                </form>
                            )}
                        </article>

                    </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProfileApp />);
    </script>
</body>
</html>
