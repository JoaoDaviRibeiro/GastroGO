<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GastroGO Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-auth">
    <main class="page">
        <div class="bg-mesh"></div>
        <div class="noise"></div>
        <div id="root"></div>
    </main>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script src="script.js"></script>
    <script type="text/babel">
        const modes = {
            login: {
                label: 'Log in',
                headline: 'Sign in to GastroGO',
                action: 'login',
                cta: 'Let me in'
            },
            signup: {
                label: 'Create account',
                headline: 'Create your workspace',
                action: 'signup',
                cta: 'Join the chefs'
            }
        };

        function AuthApp() {
            const [mode, setMode] = React.useState('login');
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [message, setMessage] = React.useState('');
            const [tone, setTone] = React.useState('info');
            const [loading, setLoading] = React.useState(false);
            const [resetting, setResetting] = React.useState(false);

            React.useEffect(() => {
                setMessage('');
            }, [mode]);

            const handleSubmit = async (event) => {
                event.preventDefault();
                setLoading(true);
                setMessage('Processing...');
                setTone('info');

                const result = await window.auth(modes[mode].action, { email, password });
                setLoading(false);
                setTone(result.tone);
                setMessage(result.message);

                if (mode === 'login' && result.success) {
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 900);
                }
            };

            const handlePasswordReset = async () => {
                setResetting(true);
                setMessage('Checking your email...');
                setTone('info');

                const result = await window.requestPasswordReset(email);
                setResetting(false);
                setTone(result.tone);
                setMessage(result.message);
            };

            return (
                <div className="auth-grid">
                    <section className="hero-panel">
                        <div>
                            <p className="eyebrow">GASTROGO</p>
                            <h1>Modern hospitality<br/>meets precise access.</h1>
                            <p>
                                Manage your kitchens, staff, and guest experiences from one secure portal.
                                Sign in to continue or start fresh with a new workspace.
                            </p>
                        </div>
                        <div className="stat-row">
                            <div className="stat">
                                <strong>200+</strong>
                                active teams today
                            </div>
                            <div className="stat">
                                <strong>99.98%</strong>
                                uptime last quarter
                            </div>
                        </div>
                    </section>

                    <section className="form-panel">
                        <div className="mode-switch" role="tablist" aria-label="auth mode">
                            {Object.entries(modes).map(([key, value]) => (
                                <button
                                    key={key}
                                    className={mode === key ? 'active' : ''}
                                    onClick={() => setMode(key)}
                                    type="button"
                                    role="tab"
                                    aria-selected={mode === key}
                                >
                                    {value.label}
                                </button>
                            ))}
                        </div>

                        <h2>{modes[mode].headline}</h2>
                        <p className="form-lede">
                            Use your email and password to {mode === 'login' ? 'access your dashboard.' : 'spin up a secure account.'}
                        </p>

                        <form className="auth-form" onSubmit={handleSubmit}>
                            <label>
                                Email address
                                <input
                                    type="email"
                                    placeholder="chef@gastrogosuite.com"
                                    value={email}
                                    onChange={(event) => setEmail(event.target.value)}
                                    required
                                />
                            </label>

                            <label>
                                Password
                                <input
                                    type="password"
                                    placeholder="••••••••"
                                    value={password}
                                    onChange={(event) => setPassword(event.target.value)}
                                    required
                                />
                            </label>

                            <div className="actions">
                                <button className="primary" type="submit" disabled={loading}>
                                    {loading ? 'Working...' : modes[mode].cta}
                                </button>
                                <button
                                    type="button"
                                    className="ghost"
                                    onClick={handlePasswordReset}
                                    disabled={resetting}
                                >
                                    {resetting ? 'Sending link...' : 'Forgot password?'}
                                </button>
                            </div>
                        </form>

                        {message && (
                            <div className={`status-strip ${tone}`} role="status">
                                {message}
                            </div>
                        )}
                    </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthApp />);
    </script>
</body>
</html>
