<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GastroGO Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-auth">
    <main class="page">
        <div class="bg-mesh"></div>
        <div class="noise"></div>
        <div id="root"></div>
    </main>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
    <script type="text/babel">
        function MultilineText({ text = '' }) {
            const lines = String(text).split('\n');
            return (
                <>
                    {lines.map((line, index) => (
                        <React.Fragment key={`${line}-${index}`}>
                            {line}
                            {index < lines.length - 1 && <br />}
                        </React.Fragment>
                    ))}
                </>
            );
        }

        function AuthApp() {
            const { t, locale } = window.useI18n();
            const [mode, setMode] = React.useState('login');
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [message, setMessage] = React.useState('');
            const [tone, setTone] = React.useState('info');
            const [loading, setLoading] = React.useState(false);
            const [resetting, setResetting] = React.useState(false);

            React.useEffect(() => {
                setMessage('');
            }, [mode, locale]);

            React.useEffect(() => {
                document.title = t('meta.title.auth');
            }, [locale, t]);

            const modes = React.useMemo(() => ({
                login: {
                    label: t('auth.modes.login.label'),
                    headline: t('auth.modes.login.headline'),
                    lede: t('auth.modes.login.lede'),
                    cta: t('auth.modes.login.cta'),
                    action: 'login'
                },
                signup: {
                    label: t('auth.modes.signup.label'),
                    headline: t('auth.modes.signup.headline'),
                    lede: t('auth.modes.signup.lede'),
                    cta: t('auth.modes.signup.cta'),
                    action: 'signup'
                }
            }), [locale, t]);

            const handleSubmit = async (event) => {
                event.preventDefault();
                setLoading(true);
                setMessage(t('auth.status.processing'));
                setTone('info');

                const result = await window.auth(modes[mode].action, { email, password });
                setLoading(false);
                setTone(result.tone);
                setMessage(result.message);

                if (mode === 'login' && result.success) {
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 900);
                }
            };

            const handlePasswordReset = async () => {
                setResetting(true);
                setMessage(t('auth.status.resetting'));
                setTone('info');

                const result = await window.requestPasswordReset(email);
                setResetting(false);
                setTone(result.tone);
                setMessage(result.message);
            };

            const heroHeadline = t('auth.hero.headline');

            return (
                <div className="auth-grid">
                    <section className="hero-panel">
                        <div>
                            <p className="eyebrow">{t('auth.hero.eyebrow')}</p>
                            <h1><MultilineText text={heroHeadline} /></h1>
                            <p>{t('auth.hero.body')}</p>
                        </div>
                        <div className="stat-row">
                            <div className="stat">
                                <strong>{t('auth.stats.teamsValue')}</strong>
                                {t('auth.stats.teamsLabel')}
                            </div>
                            <div className="stat">
                                <strong>{t('auth.stats.uptimeValue')}</strong>
                                {t('auth.stats.uptimeLabel')}
                            </div>
                        </div>
                    </section>

                    <section className="form-panel">
                        <div className="mode-switch" role="tablist" aria-label="auth mode">
                            {Object.entries(modes).map(([key, value]) => (
                                <button
                                    key={key}
                                    className={mode === key ? 'active' : ''}
                                    onClick={() => setMode(key)}
                                    type="button"
                                    role="tab"
                                    aria-selected={mode === key}
                                >
                                    {value.label}
                                </button>
                            ))}
                        </div>

                        <h2>{modes[mode].headline}</h2>
                        <p className="form-lede">{modes[mode].lede}</p>

                        <form className="auth-form" onSubmit={handleSubmit}>
                            <label>
                                {t('auth.form.emailLabel')}
                                <input
                                    type="email"
                                    placeholder={t('auth.form.emailPlaceholder')}
                                    value={email}
                                    onChange={(event) => setEmail(event.target.value)}
                                    required
                                />
                            </label>

                            <label>
                                {t('auth.form.passwordLabel')}
                                <input
                                    type="password"
                                    placeholder={t('auth.form.passwordPlaceholder')}
                                    value={password}
                                    onChange={(event) => setPassword(event.target.value)}
                                    required
                                />
                            </label>

                            <div className="actions">
                                <button className="primary" type="submit" disabled={loading}>
                                    {loading ? t('auth.form.submitWorking') : modes[mode].cta}
                                </button>
                                <button
                                    type="button"
                                    className="ghost"
                                    onClick={handlePasswordReset}
                                    disabled={resetting}
                                >
                                    {resetting ? t('auth.form.forgotWorking') : t('auth.form.forgot')}
                                </button>
                            </div>
                        </form>

                        {message && (
                            <div className={`status-strip ${tone}`} role="status">
                                {message}
                            </div>
                        )}
                    </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthApp />);
    </script>
</body>
</html>
