<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GastroGO Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-dashboard">
    <main class="page dashboard-page">
        <div class="bg-mesh"></div>
        <div class="noise"></div>
        <div id="root"></div>
    </main>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
    <script type="text/babel" data-presets="env,react">
        function ThemeToggle({ theme, onToggle }) {
            const { t } = window.useI18n();
            const nextLabel = theme === 'dark' ? t('common.themeToggle.toLight') : t('common.themeToggle.toDark');

            return (
                <button
                    type="button"
                    className="theme-toggle"
                    onClick={onToggle}
                    aria-label={nextLabel}
                >
                    <span className="theme-toggle-track" aria-hidden="true">
                        <span className="theme-toggle-thumb" data-theme={theme}></span>
                    </span>
                </button>
            );
        }

        function DashboardApp() {
            const RESTAURANTS_PER_PAGE = 15;
            const { t, locale } = window.useI18n();
            const [user, setUser] = React.useState(null);
            const [restaurants, setRestaurants] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [status, setStatus] = React.useState({ tone: 'info', message: '' });
            const [query, setQuery] = React.useState('');
            const [cuisineFilter, setCuisineFilter] = React.useState('all');
            const [sortOrder, setSortOrder] = React.useState('rating-desc');
            const [page, setPage] = React.useState(1);
            const [theme, setTheme] = React.useState(() => {
                if (typeof window !== 'undefined' && window.getPreferredTheme) {
                    return window.getPreferredTheme();
                }
                return 'dark';
            });
            const formatCategory = React.useCallback((types = []) => {
                if (!Array.isArray(types) || types.length === 0) {
                    return t('dashboard.cards.cuisineTbd');
                }
                return types[0].replace(/_/g, ' ');
            }, [t]);
            const formatRatingSummary = React.useCallback((restaurant) => {
                const ratingValue = Number(restaurant.rating);
                if (!ratingValue) {
                    return t('dashboard.cards.ratingUnavailable');
                }
                const reviewCount = Number(restaurant.user_ratings_total) || 0;
                const formattedCount = reviewCount.toLocaleString(locale === 'pt-BR' ? 'pt-BR' : 'en-US');
                return t('dashboard.cards.googleRating', {
                    rating: ratingValue.toFixed(1),
                    reviews: formattedCount
                });
            }, [locale, t]);

            React.useEffect(() => {
                document.title = t('meta.title.dashboard');
            }, [locale, t]);

            const loadData = React.useCallback(async (forceRefresh = false) => {
                const token = localStorage.getItem('sb_token');

                if (!token) {
                    window.location.href = '/';
                    return;
                }

                setLoading(true);
                setStatus({ tone: 'info', message: t('dashboard.status.syncing') });

                try {
                    const restaurantsEndpoint = forceRefresh ? '/api/restaurants?refresh=1' : '/api/restaurants';
                    const [userRes, restaurantRes] = await Promise.all([
                        fetch('/api/dashboard', { headers: { Authorization: `Bearer ${token}` } }),
                        fetch(restaurantsEndpoint, { headers: { Authorization: `Bearer ${token}` } })
                    ]);

                    if (userRes.status === 401 || restaurantRes.status === 401) {
                        if (window.handleSessionExpiry) {
                            window.handleSessionExpiry();
                        } else {
                            localStorage.removeItem('sb_token');
                            window.location.href = '/';
                        }
                        return;
                    }

                    if (!userRes.ok || !restaurantRes.ok) {
                        throw new Error('Request failed');
                    }

                    const profile = await userRes.json();
                    const list = await restaurantRes.json();

                    setUser(profile);
                    setRestaurants(Array.isArray(list) ? list : []);
                    setPage(1);
                    setStatus({ tone: 'success', message: t('dashboard.status.ready') });
                } catch (error) {
                    console.error('Dashboard load failed:', error);
                    setStatus({ tone: 'error', message: t('dashboard.status.error') });
                } finally {
                    setLoading(false);
                }
            }, [t]);

            React.useEffect(() => {
                loadData();
            }, [loadData]);

            React.useEffect(() => {
                if (typeof window === 'undefined') return;
                if (window.setPreferredTheme) {
                    window.setPreferredTheme(theme);
                } else {
                    document.body?.setAttribute('data-theme', theme);
                    localStorage.setItem('gg_theme', theme);
                }
            }, [theme]);

            React.useEffect(() => {
                if (typeof window === 'undefined') return undefined;
                const handleThemeChange = (event) => {
                    const next = event.detail?.theme;
                    setTheme((prev) => (next && next !== prev ? next : prev));
                };
                window.addEventListener('gastro:theme-change', handleThemeChange);
                return () => window.removeEventListener('gastro:theme-change', handleThemeChange);
            }, []);

            const toggleTheme = React.useCallback(() => {
                setTheme((prev) => (prev === 'dark' ? 'light' : 'dark'));
            }, []);

            const handleLogout = () => {
                if (window.logout) {
                    window.logout();
                    return;
                }

                localStorage.removeItem('sb_token');
                window.location.href = '/';
            };

            const goToProfile = () => {
                window.location.href = '/profile.html';
            };

            const cuisineOptions = React.useMemo(() => {
                const unique = new Set();
                restaurants.forEach((item) => {
                    const label = formatCategory(item.types);
                    if (label) unique.add(label);
                });
                return Array.from(unique).sort();
            }, [formatCategory, restaurants]);

            const filteredRestaurants = React.useMemo(() => {
                return restaurants.filter((restaurant) => {
                    const categoryLabel = formatCategory(restaurant.types);
                    const matchesCuisine = cuisineFilter === 'all' || categoryLabel === cuisineFilter;
                    const normalizedQuery = query.trim().toLowerCase();

                    if (!normalizedQuery) return matchesCuisine;

                    const haystack = `${restaurant.name || ''} ${categoryLabel || ''} ${restaurant.address || ''}`.toLowerCase();
                    return matchesCuisine && haystack.includes(normalizedQuery);
                });
            }, [cuisineFilter, formatCategory, query, restaurants]);

            React.useEffect(() => {
                setPage(1);
            }, [query, cuisineFilter, sortOrder]);

            const sortedRestaurants = React.useMemo(() => {
                const sorted = [...filteredRestaurants];
                sorted.sort((left, right) => {
                    const leftHasPhoto = left.photo_url ? 1 : 0;
                    const rightHasPhoto = right.photo_url ? 1 : 0;
                    if (leftHasPhoto !== rightHasPhoto) {
                        return rightHasPhoto - leftHasPhoto;
                    }

                    const leftRating = Number(left.rating) || 0;
                    const rightRating = Number(right.rating) || 0;

                    if (sortOrder === 'rating-asc') {
                        return leftRating - rightRating;
                    }

                    return rightRating - leftRating;
                });
                return sorted;
            }, [filteredRestaurants, sortOrder]);

            const totalPages = React.useMemo(() => (
                Math.max(1, Math.ceil(sortedRestaurants.length / RESTAURANTS_PER_PAGE))
            ), [sortedRestaurants.length]);

            React.useEffect(() => {
                setPage((current) => Math.min(current, totalPages));
            }, [totalPages]);

            const paginatedRestaurants = React.useMemo(() => {
                const start = (page - 1) * RESTAURANTS_PER_PAGE;
                return sortedRestaurants.slice(start, start + RESTAURANTS_PER_PAGE);
            }, [page, sortedRestaurants]);

            const pageSummary = React.useMemo(() => {
                if (sortedRestaurants.length === 0) {
                    return t('dashboard.pagination.empty');
                }
                const start = (page - 1) * RESTAURANTS_PER_PAGE + 1;
                const end = Math.min(page * RESTAURANTS_PER_PAGE, sortedRestaurants.length);
                return t('dashboard.pagination.summary', {
                    start,
                    end,
                    total: sortedRestaurants.length
                });
            }, [page, sortedRestaurants.length, t]);

            const stats = React.useMemo(() => {
                const total = restaurants.length;
                const mapped = restaurants.filter((res) => Number(res.lat) && Number(res.lng)).length;
                const missingAddress = restaurants.filter((res) => !res.address).length;
                return { total, mapped, missingAddress };
            }, [restaurants]);

            return (
                <div className="dashboard-shell">
                    <header className="dashboard-header">
                        <div>
                            <p className="eyebrow">{t('dashboard.header.eyebrow')}</p>
                            <h1>{t('dashboard.header.title')}</h1>
                            <p>{t('dashboard.header.body')}</p>
                        </div>

                        <div className="header-actions">
                            <ThemeToggle theme={theme} onToggle={toggleTheme} />
                            <div className="user-pill">
                                <span>{user?.email || t('dashboard.userPillFallback')}</span>
                            </div>
                            <button
                                className="ghost"
                                type="button"
                                onClick={goToProfile}
                                aria-label={t('common.actions.openProfile')}
                            >
                                <svg
                                    width="20"
                                    height="20"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                                    aria-hidden="true"
                                >
                                    <circle cx="12" cy="7" r="4" stroke="currentColor" strokeWidth="1.5" />
                                    <path
                                        d="M5 19c0-3.314 3.134-6 7-6s7 2.686 7 6"
                                        stroke="currentColor"
                                        strokeWidth="1.5"
                                        strokeLinecap="round"
                                    />
                                </svg>
                            </button>
                            <button className="ghost" type="button" onClick={handleLogout}>
                                {t('common.actions.logout')}
                            </button>
                        </div>
                    </header>

                    {status.message && (
                        <div className={`status-strip ${status.tone}`} role="status">
                            {status.message}
                        </div>
                    )}

                    <section className="stat-grid">
                        <article className="stat-card">
                            <p className="label">{t('dashboard.stats.active.label')}</p>
                            <strong>{stats.total}</strong>
                            <small>{t('dashboard.stats.active.sublabel')}</small>
                        </article>
                        <article className="stat-card">
                            <p className="label">{t('dashboard.stats.mapped.label')}</p>
                            <strong>{stats.mapped}</strong>
                            <small>{t('dashboard.stats.mapped.sublabel')}</small>
                        </article>
                        <article className="stat-card">
                            <p className="label">{t('dashboard.stats.missing.label')}</p>
                            <strong>{stats.missingAddress}</strong>
                            <small>{t('dashboard.stats.missing.sublabel')}</small>
                        </article>
                    </section>

                    <section className="panel">
                        <div className="panel-header">
                            <div>
                                <h2>{t('dashboard.panel.title')}</h2>
                                <p>{t('dashboard.panel.body')}</p>
                            </div>
                            <div className="panel-controls">
                                <input
                                    type="search"
                                    placeholder={t('dashboard.panel.searchPlaceholder')}
                                    value={query}
                                    onChange={(event) => setQuery(event.target.value)}
                                />
                                <select value={cuisineFilter} onChange={(event) => setCuisineFilter(event.target.value)}>
                                    <option value="all">{t('dashboard.filter.allCuisines')}</option>
                                    {cuisineOptions.map((cuisine) => (
                                        <option key={cuisine} value={cuisine}>
                                            {cuisine}
                                        </option>
                                    ))}
                                </select>
                                <select value={sortOrder} onChange={(event) => setSortOrder(event.target.value)}>
                                    <option value="rating-desc">{t('dashboard.sort.ratingHighToLow')}</option>
                                    <option value="rating-asc">{t('dashboard.sort.ratingLowToHigh')}</option>
                                </select>
                                <button type="button" className="ghost" onClick={loadData}>
                                    {t('dashboard.panel.refresh')}
                                </button>
                                <button
                                    type="button"
                                    className="ghost discreet"
                                    onClick={() => loadData(true)}
                                    aria-label={t('dashboard.panel.refreshCache')}
                                    title={t('dashboard.panel.refreshCache')}
                                >
                                    {t('dashboard.panel.refreshCache')}
                                </button>
                            </div>
                        </div>

                        {loading ? (
                            <div className="panel-loading">{t('dashboard.panel.loading')}</div>
                        ) : sortedRestaurants.length === 0 ? (
                            <div className="panel-empty">
                                <p>{t('dashboard.panel.empty')}</p>
                                <button type="button" className="ghost" onClick={() => {
                                    setQuery('');
                                    setCuisineFilter('all');
                                }}>
                                    {t('dashboard.panel.resetFilters')}
                                </button>
                            </div>
                        ) : (
                            <div className="restaurant-grid">
                                {paginatedRestaurants.map((restaurant) => {
                                    const hasCoordinates = Number(restaurant.lat) && Number(restaurant.lng);
                                    const mapsUrl = hasCoordinates
                                        ? `https://www.google.com/maps?q=${restaurant.lat},${restaurant.lng}`
                                        : null;

                                    const categoryLabel = formatCategory(restaurant.types);
                                    const ratingSummary = formatRatingSummary(restaurant);

                                    return (
                                        <article className="restaurant-card" key={restaurant.id}>
                                            {restaurant.photo_url && (
                                                <div className="restaurant-photo">
                                                    <img
                                                        src={restaurant.photo_url}
                                                        alt={`${restaurant.name} hero`}
                                                        loading="lazy"
                                                    />
                                                </div>
                                            )}
                                            <div className="restaurant-heading">
                                                <h3>{restaurant.name}</h3>
                                                <span className="badge">{categoryLabel}</span>
                                            </div>
                                            <p className="restaurant-address">{restaurant.address || t('dashboard.cards.addressMissing')}</p>
                                            <div className="restaurant-meta">
                                                <span>{ratingSummary}</span>
                                                {mapsUrl && (
                                                    <a href={mapsUrl} target="_blank" rel="noopener noreferrer">
                                                        {t('dashboard.cards.viewOnMaps')}
                                                    </a>
                                                )}
                                            </div>
                                        </article>
                                    );
                                })}
                            </div>
                        )}

                        {!loading && filteredRestaurants.length > 0 && (
                            <div className="pagination-controls">
                                <button
                                    type="button"
                                    className="ghost"
                                    onClick={() => setPage((current) => Math.max(1, current - 1))}
                                    disabled={page === 1}
                                >
                                    {t('dashboard.pagination.previous')}
                                </button>
                                <p className="pagination-summary">{pageSummary}</p>
                                <button
                                    type="button"
                                    className="ghost"
                                    onClick={() => setPage((current) => Math.min(totalPages, current + 1))}
                                    disabled={page === totalPages}
                                >
                                    {t('dashboard.pagination.next')}
                                </button>
                            </div>
                        )}
                    </section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DashboardApp />);
    </script>
</body>
</html>
